<svg xmlns:c2pa="http://c2pa.org/manifest" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, sans-serif"
     font-size="13">
    <metadata>
        <c2pa:manifest>
            
        </c2pa:manifest>
    </metadata>
    <rect width="900" height="560" fill="#fff"/>
    <text x="20" y="22" font-size="11" fill="#444">Submitted by: UMANG GOSWAMI | GitHub: @goswamiumang108 | Email:
        go.umang108@gmail.com
    </text>
    <text x="20" y="38" font-size="11" fill="#444">Ticket: SCRUM-14</text>
    <text x="450" y="66" text-anchor="middle" font-size="17" font-weight="bold">QuMail - Use Case Diagram (incl. KM
        Simulator)
    </text>

    <!-- boundaries -->
    <rect x="190" y="85" width="260" height="440" fill="#f4f8ff" stroke="#3366aa" stroke-width="2"/>
    <text x="320" y="106" text-anchor="middle" font-weight="bold">QuMail Client</text>
    <rect x="590" y="85" width="270" height="440" fill="#f6fff4" stroke="#2e8b3d" stroke-width="2"/>
    <text x="725" y="106" text-anchor="middle" font-weight="bold">KM Simulator (REST API)</text>

    <!-- actors -->
    <g stroke="#000" stroke-width="2" fill="none">
        <circle cx="70" cy="250" r="14"/>
        <line x1="70" y1="264" x2="70" y2="310"/>
        <line x1="40" y1="279" x2="100" y2="279"/>
        <line x1="70" y1="310" x2="48" y2="345"/>
        <line x1="70" y1="310" x2="92" y2="345"/>
        <circle cx="520" cy="465" r="0"/>
    </g>
    <text x="70" y="366" text-anchor="middle" font-weight="bold">User</text>
    <text x="70" y="382" text-anchor="middle" font-size="11">(Sender / Receiver)</text>
    <text x="450" y="548" text-anchor="middle" font-size="11" fill="#555">Email service (Gmail) is an external system
        used by QuMail; not shown as an actor for this ticket.
    </text>

    <!-- QuMail use cases -->
    <g fill="#fff" stroke="#3366aa" stroke-width="1.5">
        <ellipse cx="320" cy="160" rx="100" ry="26"/>
        <ellipse cx="320" cy="230" rx="100" ry="26"/>
        <ellipse cx="320" cy="300" rx="100" ry="26"/>
        <ellipse cx="320" cy="370" rx="100" ry="26"/>
        <ellipse cx="320" cy="440" rx="100" ry="26"/>
    </g>
    <g text-anchor="middle">
        <text x="320" y="164">Compose email</text>
        <text x="320" y="234">Select security level (1/2/3)</text>
        <text x="320" y="304">Send email / attachment</text>
        <text x="320" y="374">Receive &amp; decrypt email</text>
        <text x="320" y="444">View key bank status</text>
    </g>

    <!-- KM use cases -->
    <g fill="#fff" stroke="#2e8b3d" stroke-width="1.5">
        <ellipse cx="725" cy="160" rx="105" ry="26"/>
        <ellipse cx="725" cy="230" rx="105" ry="26"/>
        <ellipse cx="725" cy="300" rx="105" ry="26"/>
        <ellipse cx="725" cy="370" rx="105" ry="26"/>
        <ellipse cx="725" cy="440" rx="105" ry="26"/>
    </g>
    <g text-anchor="middle">
        <text x="725" y="164">GET /keys/status</text>
        <text x="725" y="234">GET /keys/available</text>
        <text x="725" y="304">POST /keys/request (reserve)</text>
        <text x="725" y="374">POST /keys/consume</text>
        <text x="725" y="444">GET /keys/{key_id}</text>
    </g>

    <!-- user associations -->
    <g stroke="#000" stroke-width="1.2">
        <line x1="100" y1="279" x2="220" y2="165"/>
        <line x1="100" y1="279" x2="220" y2="232"/>
        <line x1="100" y1="279" x2="220" y2="300"/>
        <line x1="100" y1="279" x2="220" y2="368"/>
        <line x1="100" y1="279" x2="240" y2="430"/>
    </g>

    <!-- include / use dependencies QuMail -> KM -->
    <g stroke="#555" stroke-width="1.2" stroke-dasharray="6 4" fill="none" marker-end="url(#a)">
        <line x1="420" y1="300" x2="620" y2="300"/>
        <line x1="410" y1="380" x2="622" y2="372"/>
        <line x1="395" y1="360" x2="640" y2="438"/>
        <line x1="410" y1="436" x2="625" y2="168"/>
        <line x1="410" y1="430" x2="630" y2="234"/>
    </g>
    <defs>
        <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
            <path d="M0,0 L10,4 L0,8" fill="none" stroke="#555"/>
        </marker>
    </defs>
    <text x="505" y="292" font-size="11" fill="#555">&#171;include&#187;</text>
    <text x="450" y="472" font-size="11" fill="#555">(QuMail calls KM API for all key operations)</text>
</svg>
